<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Readers: Word Sounds Game</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #fef2f2;
            color: #1e293b;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 4px solid #f87171;
        }
        h1 {
            color: #dc2626;
            font-size: 2rem;
            margin-top: 0;
        }
        .interactive-area {
            background-color: #ffedd5;
            padding: 20px;
            border-radius: 20px;
            border: 3px dashed #ea580c;
            margin: 20px 0;
        }
        .phrase-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .word {
            font-size: 2.8rem;
            font-weight: bold;
            color: #1e293b;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 8px;
            transition: all 0.1s ease;
        }
        .word:hover {
            background-color: #fdba74;
            color: #7c2d12;
            transform: scale(1.1);
        }
        .audio-btn {
            background: #ea580c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .audio-btn:active {
            transform: scale(0.95);
        }
        .hint-text {
            font-size: 0.95rem;
            color: #ea580c;
            font-weight: bold;
            margin: 0;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        .option-card {
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            padding: 15px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-card:hover {
            border-color: #3b82f6;
            background: #eff6ff;
            transform: translateY(-5px);
        }
        .option-card .emoji {
            font-size: 4.5rem;
            display: block;
        }
        .feedback {
            font-size: 1.6rem;
            font-weight: bold;
            height: 40px;
            margin-top: 20px;
        }
        .success { color: #16a34a; }
        .error { color: #dc2626; }
        .score {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4f46e5;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Listen &amp; Read! 🔊</h1>
    
    <div class="interactive-area">
        <div class="phrase-container">
            <button class="audio-btn" onclick="speakFullPhrase()" aria-label="Listen to full phrase">🔊</button>
            <div id="phrase-words" style="display: inline-flex; gap: 12px; flex-wrap: wrap;">
                <!-- Words injected by JS -->
            </div>
        </div>
        <p class="hint-text">👉 Tap individual words to hear their exact sound!</p>
    </div>
    
    <div class="options-grid" id="options">
        <!-- Choices injected by JS -->
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="score">Stars: <span id="score-count">0</span> ⭐</div>
</div>

<script>
    const gameData = [
        { phrase: "Big red apple", emoji: "🍎", distractors: ["🍌", "🚗", "🐶"] },
        { phrase: "Run fast", emoji: "🏃", distractors: ["🛌", "🍔", "🧸"] },
        { phrase: "A blue car", emoji: "🚗", distractors: ["✈️", "🐱", "🍎"] },
        { phrase: "Happy cat", emoji: "🐱", distractors: ["🐸", "🍕", "⏰"] },
        { phrase: "One green tree", emoji: "🌳", distractors: ["🎈", "🐟", "🍦"] },
        { phrase: "Yellow sun", emoji: "☀️", distractors: ["🌙", "🌧️", "⛵"] },
        { phrase: "Swim in water", emoji: "🏊", distractors: ["🚲", "😴", "🍕"] },
        { phrase: "Cute little dog", emoji: "🐶", distractors: ["🦁", "🚜", "🍩"] },
        { phrase: "Fly a kite", emoji: "🪁", distractors: ["🚗", "🎸", "🧁"] },
        { phrase: "Sweet ice cream", emoji: "🍦", distractors: ["🍿", "🍉", "👠"] }
    ];

    let currentQuestion = 0;
    let score = 0;

    // Helper function to handle standard Speech Synthesis configurations
    function playAudio(text, rate = 0.75) {
        // Cancel active speech so audio elements do not overlap weirdly
        window.speechSynthesis.cancel(); 
        
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = rate; // Slower rate helps toddlers catch distinct phonetic units
        utterance.pitch = 1.25; // High pitched, friendly animation style voice
        window.speechSynthesis.speak(utterance);
    }

    function loadQuestion() {
        document.getElementById("feedback").innerText = "";
        let currentData = gameData[currentQuestion];
        
        // Split phrase into interactive single words
        const wordsContainer = document.getElementById("phrase-words");
        wordsContainer.innerHTML = "";
        
        const words = currentData.phrase.split(" ");
        words.forEach(word => {
            const wordSpan = document.createElement("span");
            wordSpan.className = "word";
            wordSpan.innerText = word;
            // Cleans up trailing punctuation if any for proper pronunciation engine parsing
            const cleanWord = word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
            wordSpan.onclick = () => playAudio(cleanWord, 0.6); 
            wordsContainer.appendChild(wordSpan);
        });

        // Trigger full sentence readout automatically upon scene initialization
        setTimeout(speakFullPhrase, 500);

        // Mix correct element with distractors
        let choices = [currentData.emoji, ...currentData.distractors.slice(0, 2)];
        choices.sort(() => Math.random() - 0.5);

        const optionsGrid = document.getElementById("options");
        optionsGrid.innerHTML = "";

        choices.forEach(choice => {
            const card = document.createElement("div");
            card.className = "option-card";
            card.innerHTML = `<span class="emoji">${choice}</span>`;
            card.onclick = () => checkAnswer(choice, currentData.emoji);
            optionsGrid.appendChild(card);
        });
    }

    function speakFullPhrase() {
        let currentData = gameData[currentQuestion];
        playAudio(currentData.phrase, 0.75);
    }

    function checkAnswer(selected, correct) {
        const feedbackDiv = document.getElementById("feedback");
        
        if (selected === correct) {
            score++;
            document.getElementById("score-count").innerText = score;
            feedbackDiv.innerText = "Awesome! 🎉";
            feedbackDiv.className = "feedback success";
            
            playAudio("Awesome job!", 0.9);

            currentQuestion = (currentQuestion + 1) % gameData.length;
            setTimeout(loadQuestion, 1600);
        } else {
            feedbackDiv.innerText = "Try again! ✨";
            feedbackDiv.className = "feedback error";
            playAudio("Look closely, try again!", 0.85);
        }
    }

    // Initialize layout
    window.onload = loadQuestion;
</script>

</body>
</html>
